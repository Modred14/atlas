# .github/workflows/tick.yml
name: Atlas scheduler
# Calls the Atlas cron endpoint so campaigns run, research completes and replies are checked.
# Free on GitHub Actions. Scheduled runs can be delayed by several minutes; that is fine for this job.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: atlas-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run tick
        env:
          APP_URL: ${{ secrets.ATLAS_APP_URL }}
          CRON_SECRET: ${{ secrets.ATLAS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set ATLAS_APP_URL and ATLAS_CRON_SECRET repository secrets"; exit 1; fi
          code=$(curl -sS -o out.json -w "%{http_code}" --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/tick")
          cat out.json; echo
          test "$code" = "200"
